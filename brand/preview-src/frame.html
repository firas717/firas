<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Plex;src:url("../../brand/fonts/IBMPlexSansArabic-Regular.ttf");font-weight:400}
@font-face{font-family:Plex;src:url("../../brand/fonts/IBMPlexSansArabic-SemiBold.ttf");font-weight:600}
@font-face{font-family:Plex;src:url("../../brand/fonts/IBMPlexSansArabic-Bold.ttf");font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#191917;font-family:Plex;position:relative;overflow:hidden}
.band{position:absolute;left:0;width:1080px;background:#0E0E0E}
.title{top:200px;height:230px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:74px;line-height:1.3;
 background:#0E0E0E;color:transparent}
.title span{background:linear-gradient(#FFC21A,#F08A1C);-webkit-background-clip:text;background-clip:text}
.scene-title{top:430px;height:70px;display:flex;align-items:center;justify-content:flex-start;padding-right:74px;color:#fff;font-weight:600;font-size:46px;gap:18px}
.dot{width:18px;height:18px;border-radius:50%;background:#A9E34B}
.scene{position:absolute;top:500px;left:0;width:1080px;height:680px;background:#1C1F22;overflow:hidden}
.spot{position:absolute;top:-80px;left:520px;width:420px;height:820px;background:radial-gradient(ellipse at top,rgba(255,255,255,.16),rgba(255,255,255,0) 70%);transform:skewX(-8deg)}
.photo{position:absolute;top:120px;left:560px;width:420px;height:300px;border-radius:14px;background:repeating-linear-gradient(90deg,#3a3f45 0 22px,#2b2f34 22px 44px);border:4px solid #555}
.photo b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cfcfcf;font-weight:600;font-size:34px;background:rgba(0,0,0,.35)}
.ring{position:absolute;top:95px;left:535px;width:470px;height:350px;border:9px solid #D23030;border-radius:50%;transform:rotate(-6deg)}
.year{position:absolute;top:470px;left:610px;font-weight:700;font-size:120px;color:#FFC21A;direction:ltr}
.narr{position:absolute;bottom:18px;left:60px;height:470px}
.cap{position:absolute;top:1180px;left:0;width:1080px;height:240px;display:flex;align-items:center;justify-content:center}
.cap div{background:rgba(14,14,14,.88);padding:20px 34px;border-radius:14px;color:#fff;font-weight:600;font-size:62px;line-height:1.35;text-align:center;max-width:960px}
.cap em{font-style:normal;color:#D23030}
.part{top:1420px;height:140px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:58px}
.wm{position:absolute;left:72px;top:1600px;width:84px;height:84px;opacity:.85}
.prog{position:absolute;top:1908px;right:0;height:6px;width:42%;background:#D23030}
.lab{position:absolute;left:12px;font-size:24px;color:#8a8a8a;font-weight:400;direction:ltr}
</style></head><body>
<div class="band title"><span>كيف خدع هارب<br>الشرطي أمام الكاميرا؟</span></div>
<div class="band scene-title"><i class="dot"></i>هروب مستحيل</div>
<div class="scene"><div class="spot"></div><div class="photo"><b>صورة أو لقطة الحدث</b></div><div class="ring"></div><div class="year">2006</div>
<img class="narr" src="../../brand/narrator-poses/point-right.png"></div>
<div class="cap"><div>تخيّل أن تهرب من أشد <em>السجون</em><br>حراسة في أمريكا</div></div>
<div class="band part">الجزء ١</div>
<div class="band" style="top:1560px;height:360px"></div><img class="wm" src="../../brand/logo-round-240.png">
<div class="prog"></div>
<div class="lab" style="top:90px">0–200 · YouTube UI</div>
</body></html>
