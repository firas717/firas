<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<style>
  /* Readex Pro for letters; Eastern Arabic digits come from IBM Plex Sans Arabic (clearer ٦ vs ١, FONTS.md: numbers in Plex) */
  @font-face { font-family: 'Readex Pro'; src: url('../../brand/fonts/ReadexPro[HEXP,wght].ttf'); font-weight: 160 900; unicode-range: U+0000-065F, U+066A-10FFFF; }
  @font-face { font-family: 'Readex Pro'; src: url('../../brand/fonts/IBMPlexSansArabic-Bold.ttf'); font-weight: 160 900; unicode-range: U+0660-0669; }
  @font-face { font-family: 'Readex Pro X'; src: url('../../brand/fonts/ReadexPro[HEXP,wght].ttf'); font-weight: 800; font-variation-settings: 'wght' 700; }
  @font-face { font-family: 'Plex Arabic'; src: url('../../brand/fonts/IBMPlexSansArabic-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: 'Plex Arabic'; src: url('../../brand/fonts/IBMPlexSansArabic-Medium.ttf'); font-weight: 500; }
  @font-face { font-family: 'Plex Arabic'; src: url('../../brand/fonts/IBMPlexSansArabic-SemiBold.ttf'); font-weight: 600; }
  @font-face { font-family: 'Plex Arabic'; src: url('../../brand/fonts/IBMPlexSansArabic-Bold.ttf'); font-weight: 700; }
  @font-face { font-family: 'Plex Sans'; src: url('../../brand/fonts/IBMPlexSans[wdth,wght].ttf'); font-weight: 100 700; }
  @font-face { font-family: 'Aref Ruqaa'; src: url('../../brand/fonts/ArefRuqaa-Bold.ttf'); font-weight: 700; }

  /* brand tokens (BRAND.md) */
  body[data-mode="night"] { --bg:#0B0E13; --surface:#141922; --surface-alt:#1E2531; --text:#F2EFE9; --muted:#9AA3B0; --border:#2A3340; }
  body[data-mode="day"]   { --bg:#F3F0E9; --surface:#FFFFFF; --surface-alt:#E6E1D6; --text:#12161C; --muted:#5A6472; --border:#D2CCC0; }
  :root { --accent:#E9A13B; --accent-dim:#B87C25; --alert:#C8402E; --scrim:rgba(11,14,19,0.72);
          --std: cubic-bezier(0.33,0,0.10,1); }

  /* Chrome RTL fix: keep layout LTR, text RTL */
  html, body { direction: ltr; margin: 0; padding: 0; }
  body * { direction: rtl; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #0B0E13; }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; will-change: transform, opacity; }
  img { display: block; }

  .bg .bgimg { position: absolute; left: -160px; top: 0; }
  .media .mimg { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .media.full { background: #000; }
  .media .blurbg { position: absolute; inset: 0; overflow: hidden; }
  .media .blurbg img { position: absolute; left: 0; top: 0; transform-origin: 0 0; filter: blur(28px) saturate(0.9); }
  .media .scrim { position: absolute; inset: 0; background: var(--scrim); }
  body[data-mode="day"] .media .scrim { background: rgba(243,240,233,0.55); }
  .media .card { position: absolute; overflow: hidden; border-radius: 10px; box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 0 2px var(--border); background: #000; }
  .media .tint { position: absolute; inset: 0; mix-blend-mode: soft-light; pointer-events: none; }
  /* grading (approximation of the brand LUTs) */
  .grade-night .mimg { filter: contrast(1.10) saturate(0.88) brightness(0.94); }
  .grade-night.full::after, .grade-night .card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(30,37,49,0.22), rgba(11,14,19,0.10)); mix-blend-mode: multiply; }
  .grade-day .mimg { filter: contrast(1.04) saturate(1.02) brightness(1.03); }
  .grade-archive .mimg { filter: sepia(0.35) contrast(1.05) saturate(0.8); }

  /* text styles (FONTS.md sizes x1.4 for Shorts) */
  .textlayer { pointer-events: none; }
  .tx { position: absolute; left: 76px; width: 928px; text-align: center; color: var(--text); letter-spacing: 0;
        text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
  .tx .acc, .acc { color: var(--accent); }
  .tx .muted { color: var(--muted); }
  .tx.title   { font: 700 168px/1.15 'Readex Pro'; font-variation-settings: 'wght' 800; }
  .tx.subtitle{ font: 700 100px/1.2 'Readex Pro'; }
  .tx.keyword { font: 700 120px/1.15 'Readex Pro'; font-variation-settings: 'wght' 750; }
  .tx.label   { font: 600 54px/1.3 'Plex Arabic'; }
  .tx.date    { font: 700 112px/1.15 'Readex Pro'; }
  .tx.quote   { font: 500 64px/1.45 'Plex Arabic'; }
  .tx.stat    { font: 700 330px/1 'Plex Arabic'; font-feature-settings: 'tnum' 1; }
  .tx.stat .num { white-space: nowrap; unicode-bidi: plaintext; }
  .tx.stat .unit { display: block; font: 600 84px/1.2 'Plex Arabic'; color: var(--muted); margin-top: 6px; }
  .tx.latin   { font-family: 'Plex Sans'; direction: ltr; }

  /* burned captions: IBM Plex Sans Arabic 500, 48px x1.4 = 67px, max 2 lines, centred */
  .caplayer .cap { position: absolute; left: 110px; width: 820px; bottom: 470px; text-align: center;
        font: 500 67px/1.35 'Plex Arabic'; color: #FFFFFF; text-shadow: 0 2px 10px rgba(0,0,0,0.75); text-wrap: balance; }
  .caplayer .cap.band { background: rgba(0,0,0,0.58); border-radius: 8px; padding: 14px 22px; left: 88px; width: 864px; box-sizing: border-box; }

  .flash { background: #fff; }
  .grain img { width: 1080px; height: 1920px; mix-blend-mode: overlay; }
  .overlay.vignette { background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.42) 100%); }
  .overlay.topscrim { background: linear-gradient(180deg, rgba(11,14,19,0.70) 0%, rgba(11,14,19,0.0) 32%); }
  .overlay.botscrim { background: linear-gradient(0deg, rgba(11,14,19,0.75) 0%, rgba(11,14,19,0.0) 38%); }
</style>
</head>
<body data-mode="night">
<div id="stage"></div>
<script src="TIMELINE_JS"></script>
<script src="graphics/common.js"></script>
GRAPHICS_SCRIPTS
<script src="engine.js"></script>
</body>
</html>
